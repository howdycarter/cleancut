name: TheSwiftKit
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
  # Ensure generated pbxproj is compatible with your Xcode
  # Bump to match your installed Xcode version if needed (e.g., '16.0')
  xcodeVersion: '15.1'
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
targets:
  TheSwiftKit:
    type: application
    platform: iOS
    dependencies:
      - package: Supabase
      - package: TelemetryDeck
        product: TelemetryClient
      - package: RevenueCat
        product: RevenueCat
    sources:
      - path: Config
        excludes:
          - Secrets.sample.swift
      - path: Core
      - path: Modules
      - path: Backend
      - path: Resources
        excludes:
          - Info.plist # handled via info block below
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theswiftkit.app
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    scheme:
      testTargets:
        - name: TheSwiftKitTests

  TheSwiftKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TheSwiftKit

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 1.5.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
